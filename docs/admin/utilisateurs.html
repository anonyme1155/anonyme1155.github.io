<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Utilisateurs — Il Ponte</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="/" class="logo">Il Ponte</a>
      <div class="sous-logo">Back-office</div>
      <ul class="admin-nav">
        <li><a href="/admin/dashboard.html">Tableau de bord</a></li>
        <li><a href="/admin/factures.html">Factures</a></li>
        <li><a href="/admin/messages.html">Messages</a></li>
        <li><a href="/admin/contenu.html">Contenu du site</a></li>
        <li><a href="/admin/utilisateurs.html" class="actif">Utilisateurs</a></li>
      </ul>
      <div class="admin-user">
        Connecté en tant que<br />
        <strong data-champ="utilisateur-nom">…</strong>
        <div class="role" data-champ="utilisateur-role">…</div>
        <button id="btn-deconnexion">Se déconnecter</button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1>Utilisateurs</h1>
          <p>Créez des comptes pour votre équipe et gérez leurs droits d'accès.</p>
        </div>
      </div>

      <div class="panel">
        <h2>Créer un compte</h2>
        <form id="form-nouvel-utilisateur">
          <div class="form-row" style="margin-bottom:16px;">
            <div class="form-champ">
              <label for="new-username">Identifiant</label>
              <input type="text" id="new-username" name="username" required />
            </div>
            <div class="form-champ">
              <label for="new-password">Mot de passe</label>
              <input type="password" id="new-password" name="password" minlength="4" required />
            </div>
            <div class="form-champ">
              <label for="new-role">Rôle</label>
              <select id="new-role" name="role">
                <option value="employe">Employé — accès factures uniquement</option>
                <option value="gerant">Gérant — factures + contenu du site</option>
                <option value="admin">Administrateur — accès complet</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn">Créer le compte</button>
        </form>
      </div>

      <div class="panel">
        <h2>Comptes existants</h2>
        <table class="admin-table">
          <thead>
            <tr><th>Identifiant</th><th>Rôle</th><th>Créé le</th><th>Actions</th></tr>
          </thead>
          <tbody id="table-utilisateurs">
            <tr><td colspan="4" class="vide">Chargement…</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    protegerPage(["admin"]).then((user) => {
      if (!user) return;
      initDeconnexion();
      initUtilisateurs();
    });
  </script>
</body>
</html>
