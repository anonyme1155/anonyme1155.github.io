<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contenu du site — Il Ponte</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="/" class="logo">Il Ponte</a>
      <div class="sous-logo">Back-office</div>
      <ul class="admin-nav">
        <li><a href="/admin/dashboard.html">Tableau de bord</a></li>
        <li><a href="/admin/factures.html">Factures</a></li>
        <li><a href="/admin/messages.html">Messages</a></li>
        <li><a href="/admin/contenu.html" class="actif">Contenu du site</a></li>
        <li><a href="/admin/utilisateurs.html">Utilisateurs</a></li>
      </ul>
      <div class="admin-user">
        Connecté en tant que<br />
        <strong data-champ="utilisateur-nom">…</strong>
        <div class="role" data-champ="utilisateur-role">…</div>
        <button id="btn-deconnexion">Se déconnecter</button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1>Contenu du site</h1>
          <p>Modifiez les textes, les horaires et la carte affichés sur le site public.</p>
        </div>
      </div>

      <form id="form-contenu">
        <div class="panel">
          <h2>Page d'accueil</h2>
          <div class="form-champ">
            <label for="heroTitre">Titre principal</label>
            <input type="text" id="heroTitre" name="heroTitre" />
          </div>
          <div class="form-champ">
            <label for="heroSousTitre">Sous-titre</label>
            <input type="text" id="heroSousTitre" name="heroSousTitre" />
          </div>
          <div class="form-champ">
            <label for="heroBouton">Texte du bouton</label>
            <input type="text" id="heroBouton" name="heroBouton" />
          </div>
          <div class="form-champ">
            <label for="aproposTitre">Titre "Notre histoire"</label>
            <input type="text" id="aproposTitre" name="aproposTitre" />
          </div>
          <div class="form-champ">
            <label for="aproposTexte">Texte "Notre histoire"</label>
            <textarea id="aproposTexte" name="aproposTexte"></textarea>
          </div>
        </div>

        <div class="panel">
          <h2>Coordonnées</h2>
          <div class="form-champ">
            <label for="contactAdresse">Adresse</label>
            <input type="text" id="contactAdresse" name="contactAdresse" />
          </div>
          <div class="form-champ">
            <label for="contactTelephone">Téléphone</label>
            <input type="text" id="contactTelephone" name="contactTelephone" />
          </div>
          <div class="form-champ">
            <label for="contactEmail">Email</label>
            <input type="email" id="contactEmail" name="contactEmail" />
          </div>
        </div>

        <button type="submit" class="btn">Enregistrer les textes</button>
      </form>

      <form id="form-horaires" style="margin-top:32px;">
        <div class="panel">
          <h2>Horaires d'ouverture</h2>
          <div id="horaires-edit"></div>
          <button type="submit" class="btn" style="margin-top:12px;">Enregistrer les horaires</button>
        </div>
      </form>

      <form id="form-menu" style="margin-top:32px;">
        <div class="panel">
          <h2>La carte</h2>
          <div id="menu-edit"></div>
          <button type="button" id="btn-ajouter-categorie" class="btn btn-outline" style="margin:12px 8px 12px 0;">+ Ajouter une catégorie</button>
          <button type="submit" class="btn" style="margin-top:12px;">Enregistrer la carte</button>
        </div>
      </form>
    </main>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    protegerPage(["admin", "gerant"]).then((user) => {
      if (!user) return;
      initDeconnexion();
      initContenu();
    });
  </script>
</body>
</html>
